# Inactive while in this folder. To turn it on, see docs/PUBLISHING.md ("Turning CI on later").
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Also verifies gradle-wrapper.jar is a genuine Gradle release.
      - uses: gradle/actions/setup-gradle@v6

      - name: Lint, test and build
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug assembleRelease

      - name: Check permissions (no network access, ever)
        run: bash tools/check-permissions.sh app/build/outputs/apk/release/app-release-unsigned.apk

      - uses: actions/upload-artifact@v7
        with:
          name: grumpy-qr-debug-apk
          path: app/build/outputs/apk/debug/*.apk
